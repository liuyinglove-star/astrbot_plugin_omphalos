<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>翁法罗斯 · 终章</title>
<style>
  :root {
    --gold: #c9a227;
    --gold-soft: #8a6f1a;
    --text: #e8e2d4;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    background: #05060a;
    color: var(--text);
    font-family: "Noto Serif SC", "Songti SC", "STSong", serif;
    overflow: hidden;
  }

  #stars {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
  }

  /* 中心的光 */
  #glow {
    position: fixed;
    left: 50%;
    top: 50%;
    width: 70vmin;
    height: 70vmin;
    transform: translate(-50%, -50%);
    background: radial-gradient(
      circle,
      rgba(201, 162, 39, 0.10) 0%,
      rgba(201, 162, 39, 0.04) 38%,
      transparent 70%
    );
    z-index: 1;
    animation: breathe 8s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes breathe {
    0%, 100% { opacity: 0.55; transform: translate(-50%, -50%) scale(1); }
    50%      { opacity: 0.95; transform: translate(-50%, -50%) scale(1.08); }
  }

  #stage {
    position: relative;
    z-index: 2;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 6vh 8vw;
    text-align: center;
  }

  #subtitle {
    font-size: clamp(13px, 1.5vw, 17px);
    letter-spacing: 0.5em;
    color: var(--gold-soft);
    margin-bottom: 5vh;
    opacity: 0;
    animation: fadeIn 1.6s ease forwards 0.4s;
  }

  #who {
    font-size: clamp(14px, 1.6vw, 19px);
    color: var(--gold);
    letter-spacing: 0.28em;
    margin-bottom: 3.2vh;
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 0.7s ease, transform 0.7s ease;
  }
  #who.show { opacity: 1; transform: translateY(0); }

  #line {
    font-size: clamp(19px, 2.6vw, 32px);
    line-height: 2.1;
    letter-spacing: 0.06em;
    max-width: 26em;
    white-space: pre-wrap;
    min-height: 3.2em;
    color: var(--text);
    text-shadow: 0 0 26px rgba(201, 162, 39, 0.16);
  }
  #line.to-player {
    color: #f2e6c4;
    font-size: clamp(21px, 2.9vw, 35px);
    text-shadow: 0 0 40px rgba(201, 162, 39, 0.34);
  }

  /* 收尾 */
  #finale {
    position: fixed;
    left: 0; right: 0; bottom: 12vh;
    text-align: center;
    opacity: 0;
    transition: opacity 3.2s ease;
    z-index: 3;
    pointer-events: none;
  }
  #finale.show { opacity: 1; }
  #finale .big {
    font-size: clamp(22px, 3vw, 38px);
    letter-spacing: 0.4em;
    color: var(--gold);
    text-shadow: 0 0 50px rgba(201, 162, 39, 0.5);
  }
  #finale .small {
    margin-top: 2.4vh;
    font-size: clamp(12px, 1.3vw, 15px);
    color: #6d6555;
    letter-spacing: 0.32em;
  }

  /* 开场按钮 */
  #enter {
    position: fixed;
    left: 50%;
    top: 62%;
    transform: translate(-50%, -50%) scale(0.96);
    z-index: 6;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    padding: 18px 52px;
    background: transparent;
    border: 1px solid rgba(201, 162, 39, 0.5);
    border-radius: 2px;
    color: var(--gold);
    cursor: pointer;
    opacity: 0;
    pointer-events: none;
    transition: opacity 1.2s ease, transform 1.2s ease,
                background 0.4s ease, border-color 0.4s ease;
  }
  #enter.show { opacity: 1; pointer-events: auto; transform: translate(-50%, -50%) scale(1); }
  #enter:hover {
    background: rgba(201, 162, 39, 0.08);
    border-color: var(--gold);
    box-shadow: 0 0 40px rgba(201, 162, 39, 0.22);
  }
  .enter-label { font-size: clamp(17px, 2vw, 24px); letter-spacing: 0.5em; }
  .enter-hint { font-size: 11px; color: #6d6555; letter-spacing: 0.24em; }

  /* 退出按钮 */
  #exit {
    position: fixed;
    right: 3vw;
    top: 3vh;
    z-index: 7;
    padding: 8px 18px;
    font-size: 12px;
    letter-spacing: 0.2em;
    color: #6d6555;
    background: transparent;
    border: 1px solid #2a2a35;
    border-radius: 2px;
    cursor: pointer;
    opacity: 0;
    pointer-events: none;
    transition: opacity 1.6s ease, color 0.3s ease, border-color 0.3s ease;
  }
  #exit.show { opacity: 1; pointer-events: auto; }
  #exit:hover { color: var(--gold); border-color: var(--gold-soft); }

  /* 伪全屏：真全屏被拒绝时铺满视口 */
  body.pseudo-full #stage {
    position: fixed;
    inset: 0;
    z-index: 9;
    background: #05060a;
  }

  /* 真全屏时也让背景铺满 */
  :fullscreen #stars, :-webkit-full-screen #stars { width: 100vw; height: 100vh; }

  @keyframes fadeIn { to { opacity: 1; } }

  /* 逐渐暗下去的遮罩，营造退场感 */
  #veil {
    position: fixed;
    inset: 0;
    background: #05060a;
    opacity: 0;
    pointer-events: none;
    z-index: 4;
    animation: veil 2.4s ease-out forwards;
  }
  @keyframes veil {
    0% { opacity: 0.85; }
    100% { opacity: 0; }
  }
</style>
</head>
<body>
  <canvas id="stars"></canvas>
  <div id="glow"></div>
  <div id="veil"></div>

  <div id="stage">
    <div id="subtitle"></div>
    <div id="who"></div>
    <div id="line"></div>
  </div>

  <button id="enter" type="button">
    <span class="enter-label">进入终章</span>
    <span class="enter-hint">点击后进入全屏</span>
  </button>

  <button id="exit" type="button">退出全屏</button>

  <div id="finale">
    <div class="big">翁法罗斯 · 终章</div>
    <div class="small">愿你的明天，也像毛绒一样，永远温暖</div>
  </div>

  <script src="index.js"></script>
</body>
</html>
