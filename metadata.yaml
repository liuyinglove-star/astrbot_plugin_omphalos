name: astrbot_plugin_omphalos
desc: 翁法罗斯因子模拟 —— 以德谬歌为容器、十三位因子为实验体、来古士为管理员的轮回推演系统
short_desc: 十五分钟一轮的翁法罗斯因子模拟，可干预可对话
version: v1.1.0
author: 林墨
repo: https://github.com/liuyinglove-star/astrbot_plugin_omphalos
help: |
  【翁法罗斯模拟】
  /omphalos start      启动轮回推演
  /omphalos stop       暂停
  /omphalos status     查看当前状态
  /omphalos factors    列出十三位因子
  /omphalos talk <序号> <内容>   与指定因子对话
  /omphalos kharslanna <内容>    与卡厄斯兰那对话
  /omphalos intervene <内容>     作为来古士向全场投放干预
  /omphalos archive    翻阅德谬歌的档案
  /omphalos records    查看编年史
  /omphalos export     导出编年史 Markdown

  WebUI 侧边栏「翁法罗斯」可打开图形控制台。
pages:
  - name: console
    title: 翁法罗斯
  - name: epilogue
    title: 终章
